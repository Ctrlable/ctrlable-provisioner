# Ship to the Ctrlable Pro container at:
#   /etc/NetworkManager/conf.d/10-globally-managed-devices.conf
# Forces NetworkManager to manage the container's veth (eth0), which it otherwise
# leaves unmanaged — the condition that made Supervisor report host_internet:false.
# This mirrors how HAOS lets NetworkManager own all interfaces.
[keyfile]
unmanaged-devices=none
