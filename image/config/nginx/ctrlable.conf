# Ctrlable Pro host front door. Always-up entry (survives the orchestrator container being down):
# proxies to the orchestrator SPA/API on 127.0.0.1:8000 (exposed from the container by an Incus
# proxy device, added in ctrlable-firstboot), with websocket + SSE pass-through for the live UI
# (/1.0/events relay, console/exec) and a friendly fallback page while the orchestrator starts.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Friendly page whenever the orchestrator isn't answering yet.
    error_page 502 503 504 = @starting;
    location @starting {
        root /usr/share/ctrlable/www;
        try_files /starting.html =503;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # websockets (console/exec) + SSE (events relay)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;           # don't buffer the SSE event stream
        proxy_read_timeout 1h;         # long-lived event/console streams
        proxy_connect_timeout 3s;      # fail fast to @starting when the container is down
    }
}
