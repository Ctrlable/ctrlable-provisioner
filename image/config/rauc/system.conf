# RAUC system config (baked to /etc/rauc/system.conf). A/B rootfs slots, GRUB boot backend.
# Shipped in the rootfs so the RUNNING system can install the next bundle into the inactive slot.

[system]
compatible=ctrlable-pro-x86-64
bootloader=grub
# grubenv holds ORDER / <slot>_OK / <slot>_TRY; GRUB loads it from ${prefix}/grubenv where
# prefix = the dir holding grub.cfg = (ESP)/grub, and the ESP mounts at /boot/efi.
grubenv=/boot/efi/grub/grubenv
# The appliance's persistent state is the Incus `data` pool on its OWN partition — NOT a RAUC
# slot. RAUC only ever writes root-a/root-b, so `data` survives every OS update untouched (§14a).

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/disk/by-partlabel/root-a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/root-b
type=ext4
bootname=B
