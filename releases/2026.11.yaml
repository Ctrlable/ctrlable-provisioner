# Ctrlable release manifest 2026.11
#
# Versus 2026.08:
#   - Frigate runs as the Ctrlable image (ghcr.io/ctrlable/frigate, 0.18 +
#     our fixes) in a Docker LXC, with the baseline config learned at Habitat,
#     Pinecrest and Miami. The native 0.14 Frigate LXC and the separate
#     docker-portainer LXC are gone.
#   - ctrlable-pro OS 18.1 -> 18.3, hardware-manager 0.3.0 -> 0.4.1,
#     dali-bridge -> 0.5.9 (and its builder now honours app_version);
#     0.5.9 adds DT8 fixture colour ranges (config/tc_limits/set).
#   - FreePBX uses a Ctrlable builder (Sangoma installer pinned, module
#     refresh non-fatal) instead of ct/freepbx.sh.
#   - community_scripts_ref is unchanged, but zwavejs and zigbee2mqtt are no
#     longer the 2026.08 "9.x"/"1.x" wildcards: both are pinned exactly and
#     zwavejs now DECLARES the Z-Wave JS schema Core needs (see its comment).
#     (Note build.func itself is always fetched from community-scripts main;
#     see ctrlable-build build_env.)
release: "2026.11"
community_scripts_ref: "2026-06-01"
proxmox_min_version: "8.2"
templates:
  ctrlable-pro:
    kind: vm
    builder: vm/haos-vm.sh
    # Fetched automatically from the PUBLIC release Ctrlable/haos-base @
    # haos-18.1, asset ctrlable-pro-os-generic-x86-64-18.1.img.xz. The URL is
    # derived rather than configured: the template name IS the brand, and
    # haos_version is the tag. Override with haos_image_repo / haos_image_tag /
    # haos_image_asset if a release ever publishes elsewhere.
    #
    # A file already staged in /opt/ctrlable/images (or haos_image_path in
    # build.conf) still wins, so an air-gapped site can pre-seed it. What
    # changed is that a connected host no longer needs a 551MB manual copy
    # before it can build anything.
    haos_version: "18.3"
    rebrand: true
    base_backup: "ctrlable-base-2026.11.tar"
    vmid_base: 9000
    resources:
      cpu: 2
      ram: 4096
      disk: 32
  zwavejs:
    kind: lxc
    builder: ct/zwave-js-ui.sh
    # EXACT, and verified against the Core THIS release ships. 2026.11's
    # zwave_js_server client pins MIN == MAX == schema 51, so the server version
    # is not a "upgrade when convenient" matter: off that number zwave_js does
    # not load at all and every Z-Wave entity vanishes. Seen at Pinecrest
    # 2026-11-06 — server 3.10.0 (maxSchemaVersion 50) -> zwave_js unloaded,
    # which took the keymaster service-entrance lock down with it.
    #
    #   zwave-js-ui 11.25.2 -> @zwave-js/server ^3.11.0 -> maxSchemaVersion 51
    #   (3.10.0 -> 50, rejected)
    #
    # The old value was "9.x": both floating AND two majors stale, because
    # nothing reads app_version for this template (see below) so nobody ever
    # bumped it.
    #
    # NOTE app_version is DOCUMENTATION here. ct/zwave-js-ui.sh is a community
    # script and ctrlable-build passes it no version, so a fresh build installs
    # whatever is latest. Pinning it lets the manifest answer "what SHOULD be
    # installed" — which is what the compat monitor compares against — but it
    # does not yet make provisioning deterministic. Enforcing it means passing a
    # version into the script or owning the builder, as frigate and freepbx do.
    app_version: "11.25.2"
    version_probe:
      kind: exec
      command: "/opt/zwave-js-ui/zwave-js-ui-linux --version"
      parse: '([0-9]+\.[0-9]+\.[0-9]+)'
    requires:
      zwave_js_server: ">=3.11.0"
      zwave_js_api_schema: 51
    os:
      distro: debian
      version: "12"
    resources:
      cpu: 2
      ram: 2048
      disk: 8
    unprivileged: true
  zigbee2mqtt:
    kind: lxc
    builder: ct/zigbee2mqtt.sh
    # EXACT. The old "1.x" was not merely vague, it was WRONG about what this
    # manifest produces: nothing passes app_version to the community script, so
    # a fresh build today already installs 2.x. The manifest claimed a major
    # version that has not been installed for some time.
    #
    # z2m 2.0 changed configuration.yaml (options removed and renamed, migration
    # required). That boundary is why an in-place update must stay gated: the
    # monitor may flag 1.x -> 2.x, but applying it rewrites a working site's
    # config and that is a human's call, not a timer's.
    app_version: "2.14.3"
    version_probe:
      kind: exec
      command: "cat /opt/zigbee2mqtt/package.json"
      parse: '"version"\s*:\s*"([0-9]+\.[0-9]+\.[0-9]+)"'
    requires:
      gated_across: "2.0.0"
    os:
      distro: debian
      version: "12"
    resources:
      cpu: 2
      ram: 2048
      disk: 8
    unprivileged: true
  frigate:
    kind: lxc
    # Ctrlable-owned builder: Docker LXC running ghcr.io/ctrlable/frigate (our
    # 0.18 fork) with the Ctrlable baseline config. Replaces BOTH the native
    # community-script Frigate (ct/frigate.sh, built from source, 0.14) and the
    # separate docker-portainer LXC that 2026.08 shipped alongside it.
    builder: ctrlable/frigate-docker.sh
    app_version: "0.18.0-ctrlable.1"
    os:
      distro: debian
      version: "12"
    resources:
      cpu: 4
      ram: 4096
      disk: 32
    # Docker inside LXC + iGPU render node for VAAPI.
    unprivileged: false
  freepbx:
    kind: lxc
    # Ctrlable-owned builder: Sangoma's installer pinned to a commit, with the
    # bulk module refresh made non-fatal (it timed out on a Pentium N3700 and
    # ct/freepbx.sh then deleted a working PBX). See host/builders/freepbx.sh.
    builder: ctrlable/freepbx.sh
    app_version: "17"
    os:
      distro: debian
      version: "12"
    resources:
      cpu: 2
      ram: 2048
      disk: 16
    unprivileged: true
  hardware-manager:
    kind: lxc
    # ctrlable-owned builder (no community-script) — bundled at host/builders/.
    builder: ctrlable/hardware-manager.sh
    # THE REF THE BUILDER CLONES, as tag v<app_version>. Not decorative: bump
    # this to roll a release out, and two appliances built from this manifest
    # are then the same software.
    app_version: "0.4.1"
    os:
      distro: debian
      version: "12"
    resources:
      cpu: 2
      ram: 1024
      disk: 8
    # Nothing inside the CT touches hardware, so it can be unprivileged. The
    # agent does touch hardware and runs on the HOST — which is the one way this
    # template differs from every other one here: provisioning it installs a
    # systemd unit on the hypervisor as well as creating a container. Additive
    # and read-only, but not confined to the CT.
    unprivileged: true

  dali-bridge:
    kind: lxc
    # ctrlable-owned builder (no community-script) — bundled at host/builders/.
    builder: ctrlable/dali-bridge.sh
    # The tag the builder clones (v<app_version>).
    app_version: "0.5.9"
    os:
      distro: debian
      version: "12"
    resources:
      cpu: 2
      ram: 1024
      disk: 8
    # USB HID (hasseb) pass-through needs a privileged CT + nesting.
    unprivileged: false
